#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.05;pointer-events:none}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:28px 18px 60px}
header{text-align:center;padding:26px 0 18px}
.logo{font-family:"Share Tech Mono",monospace;display:inline-block;font-weight:900;letter-spacing:6px;color:var(--g);text-shadow:0 0 18px var(--glow);border:1px solid var(--g);padding:2px 14px;border-radius:4px;direction:ltr}
h1{font-size:clamp(28px,7vw,46px);margin:14px 0 6px;font-weight:900;color:#eafcff;text-shadow:0 0 24px rgba(0,199,232,.55),0 0 44px rgba(132,56,245,.4),0 0 4px rgba(150,235,255,.6)}
header p{color:var(--mut);margin:0}
.team{display:inline-block;filter:drop-shadow(0 0 16px rgba(0,199,232,.28))}.team img{display:block;width:min(270px,66vw);height:auto}
.bar{display:flex;gap:8px;margin:22px 0}
.bar i{flex:1;height:5px;border-radius:3px;background:#222;transition:.4s}
.bar i.on{background:linear-gradient(90deg,#00c7e8,#1467f5,#8438f5);box-shadow:0 0 10px var(--glow)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 20px;box-shadow:0 0 40px rgba(0,199,232,.1);display:none}
.card.show{display:block;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;font-size:22px;color:var(--g)}
.sub{color:var(--mut);margin:0 0 18px}
.timer{height:6px;background:#1c1c20;border-radius:3px;overflow:hidden;margin-bottom:18px}
.timer b{display:block;height:100%;width:100%;background:var(--g);box-shadow:0 0 10px var(--glow)}
.url{direction:ltr;text-align:left;background:#000;border:1px solid #333;border-radius:8px;padding:12px 14px;font-family:Consolas,monospace;font-size:15px;word-break:break-all;margin-bottom:18px}
.url span{color:var(--ok)}
.term{font-family:"Share Tech Mono",monospace;color:var(--g);direction:ltr;margin-top:10px;font-size:14px}.term:after{content:"_";animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.card{backdrop-filter:blur(3px)}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;padding:11px 20px;border:1px solid var(--g);background:transparent;color:var(--tx);transition:.2s;flex:1;min-width:130px}
button:hover,button:focus-visible{background:var(--g);box-shadow:0 0 18px var(--glow);outline:none}
button.solid{background:var(--g);color:#03131f}button.solid:hover{background:#6fe6fa}
.res{display:none;margin-top:18px;padding:14px 16px;border-radius:10px;border:1px solid}
.res.bad{display:block;border-color:var(--bad);background:rgba(255,59,78,.1)}
.res.good{display:block;border-color:var(--ok);background:rgba(47,224,138,.08)}
.res strong{display:block;font-size:18px;margin-bottom:4px}
.res ul{margin:8px 0 0;padding-inline-start:20px;color:#ddd}
input[type=text]{width:100%;font:inherit;direction:ltr;text-align:left;background:#000;color:var(--tx);border:1px solid #333;border-radius:8px;padding:12px 14px;font-size:17px}
input:focus{outline:none;border-color:var(--g);box-shadow:0 0 14px var(--glow)}
.meter{height:10px;background:#1c1c20;border-radius:5px;margin:14px 0 8px;overflow:hidden}
.meter b{display:block;height:100%;width:0;transition:.3s,background .3s}
.crack{font-size:20px;font-weight:900}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none;color:var(--mut);font-size:14px}
.checks li{border:1px solid #333;border-radius:20px;padding:1px 12px}
.checks li.ok{color:var(--ok);border-color:var(--ok)}
.sms{background:#16161a;border-radius:14px 14px 14px 4px;padding:14px 16px;margin-bottom:6px;border:1px solid #2b2b31}
.sms small{color:var(--mut);display:block;direction:ltr;text-align:left;margin-bottom:6px}
.sms a{color:#5ab0ff;cursor:pointer;text-decoration:underline;direction:ltr;unicode-bidi:embed}
.hot{display:inline;border-bottom:2px dashed var(--g);cursor:help}
.final{text-align:center}
.score{font-size:68px;font-weight:900;color:var(--g);text-shadow:0 0 30px var(--glow);line-height:1.1}
.tag{font-size:13px;color:var(--mut);text-align:center;margin-top:28px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== تحسينات التنسيق ===== */
main{max-width:680px;padding:38px 20px 76px}
header{padding:26px 0 6px}
header:after{content:"";display:block;width:140px;height:2px;margin:22px auto 0;border-radius:2px;background:linear-gradient(90deg,transparent,#00c7e8,#1467f5,#8438f5,transparent)}
.team img{width:min(300px,72vw)}
.term{margin-top:20px;font-size:13px;opacity:.7;letter-spacing:.5px}
h1{font-size:clamp(30px,6.4vw,44px);margin:16px 0 8px;line-height:1.35}
header p{color:#aab4d6;font-size:16px}
.bar{margin:26px 0 20px;gap:10px}.bar i{height:4px;background:#1a2142}
.card{background:linear-gradient(rgba(8,12,32,.8),rgba(8,12,32,.8)) padding-box,linear-gradient(135deg,rgba(0,199,232,.6),rgba(20,103,245,.35),rgba(138,60,245,.6)) border-box;border:1px solid transparent;border-radius:20px;padding:32px 28px;box-shadow:0 22px 60px rgba(0,0,0,.45),0 0 60px rgba(20,103,245,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h2{font-size:24px;color:#62e4f8;margin-bottom:6px}
.sub{color:#aab4d6;margin-bottom:24px}
.row{gap:12px}
button{border-radius:12px;padding:13px 22px;border-color:rgba(0,199,232,.55);background:rgba(0,199,232,.06)}
button:hover,button:focus-visible{background:rgba(0,199,232,.2);box-shadow:0 0 22px rgba(0,199,232,.35)}
button.solid{background:linear-gradient(135deg,#00c7e8,#2f8cff);color:#03131f;border-color:transparent}
button.solid:hover,button.solid:focus-visible{background:linear-gradient(135deg,#3fe0f7,#5aa6ff);box-shadow:0 0 26px rgba(0,199,232,.5)}
.url,input[type=text]{background:rgba(2,6,18,.85);border-color:#26376b;border-radius:12px}
.timer,.meter{background:#151b36}
.res{border-radius:12px}
.tag{color:#7f8bb5;margin-top:34px}
@media(max-width:480px){.card{padding:26px 20px}main{padding:28px 16px 60px}}

.fld{margin:0 0 16px}.fld label{display:block;color:#aab4d6;font-size:14px;margin-bottom:6px}
input.nm{direction:rtl;text-align:right}
.lv{display:flex;gap:10px}.lv button{min-width:0}.lv button.on{background:linear-gradient(135deg,#00c7e8,#2f8cff);color:#03131f;border-color:transparent}
.meta{display:flex;justify-content:space-between;color:#aab4d6;font-size:14px;margin-bottom:10px}
.prog{height:6px;background:#1a2142;border-radius:3px;margin-bottom:12px;overflow:hidden}.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,#00c7e8,#1467f5,#8438f5);transition:.3s}
.q{font-size:20px;font-weight:700;line-height:1.7;margin:6px 0}
.opts{display:grid;gap:10px;margin:16px 0}.opts button{width:100%;text-align:right;min-width:0;padding:13px 16px}
.opts button.ok{background:rgba(47,224,138,.22);border-color:#2fe08a}.opts button.no{background:rgba(255,59,78,.2);border-color:#ff3b4e}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.sb div{border:1px solid #26376b;border-radius:14px;padding:16px;background:rgba(2,6,18,.5)}.sb b{display:block;font-size:36px;color:#62e4f8}.sb .w{border-color:#ffd24a;box-shadow:0 0 24px rgba(255,210,74,.3)}
.trophy{font-size:84px;filter:drop-shadow(0 0 24px rgba(255,210,74,.6));animation:fl 2.4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.champ{letter-spacing:4px;font-size:24px;font-weight:900;direction:ltr;background:linear-gradient(90deg,#00c7e8,#8438f5);-webkit-background-clip:text;background-clip:text;color:transparent}
.wname{font-size:clamp(34px,9vw,56px);font-weight:900;color:#ffe08a;text-shadow:0 0 28px rgba(255,210,74,.5);margin:6px 0 4px}
#cf{position:fixed;inset:0;z-index:5;pointer-events:none;width:100%;height:100%}
</style>
</head>

$=function(i){return document.getElementById(i)},G={lvl:2};

function round(){var pool=BANK.filter(function(q){return q[0]===G.lvl}),f=pool.filter(function(q){return !G.used.has(q)});if(f.length<G.n){G.used.clear();f=pool.slice()}G.qs=sh(f).slice(0,G.n);G.qs.forEach(function(q){G.used.add(q)});G.p=0;pass()}

$('qf').className='res';$('nx').style.display='none';var o=$('qo');o.innerHTML='';

function answer(k){if(G.done)return;G.done=1;clearInterval(G.tm);var q=G.qs[G.i],ok=k===0,l=Math.max(0,1-(Date.now()-G.t0)/(T[G.lvl]*1000));

function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;var c=$('cf'),x=c.getContext('2d'),C=['#00c7e8','#1467f5','#8438f5','#00e5c8','#ffd24a','#fff'],p=[];c.width=innerWidth;c.height=innerHeight;

(function f(){x.clearRect(0,0,c.width,c.height);if(!G.cf)return;p.forEach(function(q){q.x+=q.vx;q.y+=q.vy;q.a+=.1;if(q.y>c.height)q.y=-10;x.fillStyle=q.c;x.fillRect(q.x,q.y,q.r,q.r*Math.abs(Math.cos(q.a))+1)});requestAnimationFrame(f)})()}
